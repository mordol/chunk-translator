[project]
name = "chunk-translator"
version = "0.1.0"
description = "Translate long text in chunks via installed AI CLIs (codex / claude / cursor-agent)"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
ctrans = "chunk_translator.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunk_translator"]
